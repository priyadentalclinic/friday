name: Build FRIDAY Pure Core

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Mark VII Sentinel (Pure Native)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      - name: Create assets directory
        run: mkdir -p app/src/main/assets

      - name: Inject Local Brain (Llama 3.2 1B q4 TFLite - Slim)
        run: |
          echo "[FRIDAY] Engaging high-speed satellite link for Llama Slim core injection..."
          curl -L -f "https://huggingface.co/google/llama-3.2-1b-instruct-tflite/resolve/main/llama-3.2-1b-instruct-q4.tflite" -o app/src/main/assets/llama-3.2-1b.tflite
          
          # Core Integrity Check
          FILE_SIZE=$(stat -c%s "app/src/main/assets/llama-3.2-1b.tflite")
          echo "[FRIDAY] Core size identified: $FILE_SIZE bytes"
          if [ "$FILE_SIZE" -lt 600000000 ]; then
            echo "[FRIDAY] ERROR: Llama core corrupted or truncated. Mission Aborted."
            exit 1
          fi
          echo "[FRIDAY] Llama Slim core integrity verified."

      - name: Build Mark VII APK
        run: gradle :app:assembleDebug --no-daemon
        env:
          GRADLE_OPTS: "-Xmx6144m -Xms2048m -Dfile.encoding=UTF-8 -Dorg.gradle.parallel=false -Dorg.gradle.caching=true"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FRIDAY-MARK-VII-PURE-CORE
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7

      - name: Upload to high-speed mirror (Gofile.io)
        run: |
          curl -L -F "file=@app/build/outputs/apk/debug/app-debug.apk" https://upload.gofile.io/uploadfile
