name: Build FRIDAY Iron Core APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Mark VI Sentinel (Flutter)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Local Brain
        id: cache-brain
        uses: actions/cache@v4
        with:
          path: android/app/src/main/assets/llama-3.2-1b-instruct-q4_k_m.gguf
          key: llama-3.2-1b-instruct-q4_k_m.gguf

      - name: Inject Local Brain (Llama 3.2 1B GGUF)
        if: steps.cache-brain.outputs.cache-hit != 'true'
        run: |
          echo "[FRIDAY] Accessing high-speed satellite link for model injection..."
          mkdir -p android/app/src/main/assets
          curl -L "https://huggingface.co/bartowski/Llama-3.2-1B-Instruct-GGUF/resolve/main/Llama-3.2-1B-Instruct-Q4_K_M.gguf" -o android/app/src/main/assets/llama-3.2-1b-instruct-q4_k_m.gguf

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android APK
        run: flutter build apk --debug --target-platform android-arm64

      - name: Rename APK for Delivery
        run: mv build/app/outputs/flutter-apk/app-debug.apk app-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FRIDAY-MARK-VI-IRON-CORE
          path: app-debug.apk
          retention-days: 7

      - name: Upload to high-speed mirror (Gofile.io)
        run: |
          curl -L -F "file=@app-debug.apk" https://upload.gofile.io/uploadfile
