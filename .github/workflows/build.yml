name: Build FRIDAY Mark VII (Cloud-First)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Mark VII Sentinel
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      - name: Build Mark VII APK
        run: gradle :app:assembleDebug --no-daemon
        env:
          GRADLE_OPTS: "-Xmx6144m -Xms2048m -Dfile.encoding=UTF-8 -Dorg.gradle.parallel=false -Dorg.gradle.caching=true"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FRIDAY-MARK-VII-CLOUD
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7

      - name: Upload to mirror (Gofile.io)
        run: |
          curl -L -F "file=@app/build/outputs/apk/debug/app-debug.apk" https://upload.gofile.io/uploadfile
