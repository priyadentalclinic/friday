name: Build FRIDAY Pure Core

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Mark VII Sentinel (Pure Native)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      - name: Create assets directory
        run: mkdir -p app/src/main/assets

      - name: Inject Local Brain (Qwen 2.5 0.5B TFLite)
        run: |
          echo "[FRIDAY] Accessing high-speed satellite link for model injection..."
          curl -L "https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct-TFLite/resolve/main/qwen2.5-0.5b-instruct-int8.tflite" -o app/src/main/assets/gemma-2b-it-gpu-int4.tflite

      - name: Build Mark VII APK
        run: gradle :app:assembleDebug --no-daemon
        env:
          GRADLE_OPTS: "-Xmx6144m -Xms2048m -Dfile.encoding=UTF-8 -Dorg.gradle.parallel=false -Dorg.gradle.caching=true"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FRIDAY-MARK-VII-PURE-CORE
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7

      - name: Upload to high-speed mirror (Gofile.io)
        run: |
          curl -L -F "file=@app/build/outputs/apk/debug/app-debug.apk" https://upload.gofile.io/uploadfile
