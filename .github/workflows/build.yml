name: Build FRIDAY APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Mark V.5 Sentinel Pro (16GB ARM)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create local_models directory
        run: mkdir -p android/app/src/main/assets

      - name: Inject Local Brain (Llama 3.2 1B GGUF)
        run: |
          echo "[FRIDAY] Accessing high-speed satellite link for model injection..."
          curl -L "https://huggingface.co/bartowski/Llama-3.2-1B-Instruct-GGUF/resolve/main/Llama-3.2-1B-Instruct-Q4_K_M.gguf" -o android/app/src/main/assets/llama-3.2-1b-instruct-q4_k_m.gguf

      - name: Cache C++ Build
        uses: actions/cache@v4
        with:
          path: android/app/.cxx
          key: ${{ runner.os }}-cxx-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-cxx-

      - name: Install dependencies
        run: npm install --prefer-offline --legacy-peer-deps

      - name: Create .env file
        run: |
          echo "EXPO_PUBLIC_OPENROUTER_API_KEY=${{ secrets.OPENROUTER_API_KEY }}" > .env

      - name: Install Expo CLI
        run: npm install -g @expo/cli

      - name: Prebuild Android (Sentinel Pro)
        run: npx expo prebuild --platform android --no-install

      - name: Build Expo Android Bundle
        run: npx expo export:embed --platform android --dev false --entry-file node_modules/expo/AppEntry.js --bundle-output android/app/src/main/assets/index.android.bundle --assets-dest android/app/src/main/res

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build Sentinel Pro APK (16GB RAM mode)
        working-directory: android
        run: ./gradlew assembleDebug -PreactNativeArchitectures=arm64-v8a --no-daemon
        env:
          GRADLE_OPTS: "-Xmx6144m -Xms1024m -Dfile.encoding=UTF-8 -Dorg.gradle.parallel=true -Dorg.gradle.caching=true"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FRIDAY-MARK-V-5-SENTINEL-PRO
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

      - name: Upload to high-speed mirror (Gofile.io)
        run: |
          curl -L -F "file=@android/app/build/outputs/apk/debug/app-debug.apk" https://upload.gofile.io/uploadfile
